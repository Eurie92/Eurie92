name: Redraw the ledger

on:
  schedule:
    - cron: "17 16 * * *" # 00:17 Manila time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/ledger.mjs
      - name: Commit if changed
        run: |
          git diff --quiet assets/ledger.svg && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add assets/ledger.svg
          git commit -m "chore(ledger): redraw $(date -u +%F)"
          git push
